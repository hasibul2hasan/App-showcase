<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Showcase Controller</title>
  <link rel="stylesheet" href="/style.css">
  <!-- PeerJS CDN for WebRTC P2P Sync -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="mobile-container">
    <!-- Header -->
    <div class="header" style="text-align: center; width: 100%;">
      <div class="logo" style="justify-content: center; font-size: 1.5rem;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"></path>
        </svg>
        <span>Mockup Controller</span>
      </div>
      <p class="subtitle">Stream motion via WebRTC P2P</p>
    </div>

    <!-- Main Controller Card -->
    <div class="mobile-card">
      <!-- Status Badge -->
      <div class="status-bar" style="justify-content: center; gap: 12px;">
        <span class="status-dot disconnected" id="status-dot"></span>
        <span id="status-text" style="font-weight: 600;">Disconnected</span>
      </div>

      <!-- Pairing Section -->
      <div id="pairing-section" class="control-group">
        <label class="control-label">Pairing Code</label>
        <div class="pairing-input-container">
          <input type="text" id="room-input" class="pairing-input" placeholder="e.g. 1234" maxlength="4" pattern="[0-9]*" inputmode="numeric">
          <button id="connect-btn" class="btn btn-primary" style="width: auto; padding: 10px 20px;">Pair</button>
        </div>
      </div>

      <!-- Enable Tracking & Screen Share Buttons (Visible after connected) -->
      <div id="tracking-section" style="display: none; text-align: center; flex-direction: column; gap: 16px; align-items: center; width: 100%;">
        <!-- Motion Tracking Button (Top Row) -->
        <button id="track-btn" class="motion-btn" style="margin: 0; width: 140px; height: 140px; font-size: 0.85rem;">
          <svg style="width: 32px; height: 32px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672L13.684 16.6m0 0l-2.51 2.225.569-9.47 5.227 7.917-3.286-.672zM12 2.25V4.5m5.303.197l-1.591 1.591M21.75 12h-2.25m-.197 5.303l-1.591-1.591M12 21.75V19.5m-5.303-.197l1.591-1.591M2.25 12h2.25m-.197-5.303l1.591 1.591"></path>
          </svg>
          <span id="track-btn-text">Enable Motion</span>
        </button>

        <!-- Media Sharing Buttons (Bottom Row) -->
        <div style="display: flex; gap: 12px; justify-content: center; align-items: center; width: 100%;">
          <button id="share-btn" class="motion-btn" style="margin: 0; width: 120px; height: 120px; font-size: 0.75rem; background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25"></path>
            </svg>
            <span id="share-btn-text">Share Screen</span>
          </button>

          <button id="camera-btn" class="motion-btn" style="margin: 0; width: 120px; height: 120px; font-size: 0.75rem; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); box-shadow: 0 0 15px rgba(59, 130, 246, 0.35);">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"></path>
            </svg>
            <span id="camera-btn-text">Share Camera</span>
          </button>
        </div>
        <p class="subtitle">Tap to toggle tracking or video mirroring</p>
      </div>

      <!-- Telemetry Live Stream -->
      <div class="panel">
        <span class="panel-title" style="font-size: 0.75rem;">Device Orientation Telemetry</span>
        <div class="telemetry-grid">
          <div class="telemetry-card">
            <span class="telemetry-label">Alpha (Yaw)</span>
            <span id="val-alpha" class="telemetry-value">0°</span>
          </div>
          <div class="telemetry-card">
            <span class="telemetry-label">Beta (Pitch)</span>
            <span id="val-beta" class="telemetry-value">0°</span>
          </div>
          <div class="telemetry-card">
            <span class="telemetry-label">Gamma (Roll)</span>
            <span id="val-gamma" class="telemetry-value">0°</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="mobile-footer">
      <p id="device-info">Sensors inactive</p>
    </div>
  </div>

  <script>
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const roomInput = document.getElementById('room-input');
    const connectBtn = document.getElementById('connect-btn');
    const pairingSection = document.getElementById('pairing-section');
    const trackingSection = document.getElementById('tracking-section');
    const trackBtn = document.getElementById('track-btn');
    const trackBtnText = document.getElementById('track-btn-text');
    const deviceInfo = document.getElementById('device-info');

    let peer = null;
    let activeConn = null;
    let activeCall = null;
    let room = '';
    let isTracking = false;
    let orientationData = { alpha: 0, beta: 0, gamma: 0 };
    let lastSentTime = 0;

    function updateStatus(state, message) {
      statusDot.className = 'status-dot';
      statusDot.classList.add(state);
      statusText.innerText = message || state.charAt(0).toUpperCase() + state.slice(1);
    }

    function initPeer() {
      if (typeof Peer === 'undefined') {
        console.warn('PeerJS library loading, retrying in 300ms...');
        setTimeout(initPeer, 300);
        return;
      }

      if (peer && !peer.destroyed) return;

      peer = new Peer({
        debug: 1
      });

      peer.on('open', (id) => {
        console.log('Mobile PeerJS initialized with ID:', id);
        if (room && (!activeConn || !activeConn.open)) {
          connectToDesktop();
        }
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        updateStatus('disconnected', 'Signal Error');
        connectBtn.disabled = false;
        roomInput.disabled = false;
      });
    }

    // Extract room ID from URL (supports /pair/1234, /remote/1234, ?room=1234, or #1234)
    let extractedRoom = null;

    // 1. Check Path parameter: e.g. /pair/7710, /remote/7710, /phone/7710
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    if (pathSegments.length >= 2) {
      const lastSegment = pathSegments[pathSegments.length - 1];
      if (/^[A-Za-z0-9]{4}$/.test(lastSegment)) {
        extractedRoom = lastSegment;
      }
    }

    // 2. Check Query parameter: ?room=7710, ?code=7710, ?r=7710
    if (!extractedRoom) {
      const urlParams = new URLSearchParams(window.location.search);
      extractedRoom = urlParams.get('room') || urlParams.get('code') || urlParams.get('r');
    }

    // 3. Check Hash: #7710
    if (!extractedRoom && window.location.hash) {
      const hash = window.location.hash.replace('#', '').trim();
      if (/^[A-Za-z0-9]{4}$/.test(hash)) {
        extractedRoom = hash;
      }
    }

    if (extractedRoom) {
      roomInput.value = extractedRoom.substring(0, 4);
      room = extractedRoom.substring(0, 4).toUpperCase();
    }

    // Initialize peer signaling client on load
    initPeer();

    connectBtn.addEventListener('click', () => {
      connectToDesktop();
    });

    function getDeviceName() {
      const ua = navigator.userAgent;
      if (/iPhone/i.test(ua)) return 'Apple iPhone';
      if (/iPad/i.test(ua)) return 'Apple iPad';
      if (/Android/i.test(ua)) return 'Android Device';
      return 'Mobile Controller';
    }

    function connectToDesktop() {
      room = roomInput.value.trim().toUpperCase();
      if (!room || room.length !== 4) {
        alert('Please enter a valid 4-digit pairing code.');
        return;
      }

      if (!peer || peer.destroyed || !peer.id) {
        initPeer();
        updateStatus('connecting', 'Connecting signal...');
        return;
      }

      const targetPeerId = 'appshowcase-' + room;
      updateStatus('connecting', 'Connecting...');
      connectBtn.disabled = true;
      roomInput.disabled = true;

      try {
        if (activeConn) {
          activeConn.close();
        }

        activeConn = peer.connect(targetPeerId, {
          reliable: false // Ultra-low latency for sensor streaming
        });

        activeConn.on('open', () => {
          console.log('Connected to desktop peer, awaiting approval:', targetPeerId);
          updateStatus('connecting', 'Waiting for Host...');
          pairingSection.style.display = 'none';
          trackingSection.style.display = 'none';
          deviceInfo.innerText = 'Pairing request sent. Waiting for host to approve...';

          // Send pair request with device name
          activeConn.send({
            type: 'pair_request',
            device: getDeviceName()
          });
        });

        activeConn.on('data', (data) => {
          let payload = data;
          if (typeof data === 'string') {
            try { payload = JSON.parse(data); } catch(e) {}
          }

          if (payload && payload.type === 'pair_accepted') {
            console.log('Host accepted pairing request!');
            updateStatus('connected', 'Connected');
            pairingSection.style.display = 'none';
            trackingSection.style.display = 'block';
            deviceInfo.innerText = 'Connected via WebRTC. Ready to stream.';
          } else if (payload && payload.type === 'pair_rejected') {
            console.log('Host rejected pairing request.');
            updateStatus('disconnected', 'Declined by Host');
            pairingSection.style.display = 'block';
            trackingSection.style.display = 'none';
            connectBtn.disabled = false;
            roomInput.disabled = false;
            deviceInfo.innerText = 'Connection request was declined by host.';
            stopTracking();
            stopScreenShare();
            stopCameraShare();
          } else if (payload && payload.type === 'disconnect') {
            console.log('Host disconnected session.');
            updateStatus('disconnected', 'Disconnected');
            pairingSection.style.display = 'block';
            trackingSection.style.display = 'none';
            connectBtn.disabled = false;
            roomInput.disabled = false;
            deviceInfo.innerText = 'Session disconnected by host.';
            stopTracking();
            stopScreenShare();
            stopCameraShare();
          }
        });

        activeConn.on('close', () => {
          console.log('Peer connection closed');
          updateStatus('disconnected', 'Disconnected');
          pairingSection.style.display = 'block';
          trackingSection.style.display = 'none';
          connectBtn.disabled = false;
          roomInput.disabled = false;
          deviceInfo.innerText = 'Connection lost. Try reconnecting.';
          stopTracking();
          stopScreenShare();
          stopCameraShare();
        });

        activeConn.on('error', (err) => {
          console.error('DataConnection error:', err);
          updateStatus('disconnected', 'Connection Error');
          connectBtn.disabled = false;
          roomInput.disabled = false;
        });

      } catch (e) {
        console.error('Failed to connect:', e);
        updateStatus('disconnected', 'Failed to connect');
        connectBtn.disabled = false;
        roomInput.disabled = false;
      }
    }

    // Motion Tracking Management
    trackBtn.addEventListener('click', () => {
      if (isTracking) {
        stopTracking();
      } else {
        startTracking();
      }
    });

    async function startTracking() {
      // Check for iOS 13+ permission requirements
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            enableOrientationListener();
          } else {
            alert('Sensor permission denied. Rotation tracking disabled.');
          }
        } catch (error) {
          console.error('Error requesting permission:', error);
          alert('Sensor permission request must be initiated by user gesture. Please try clicking the button again.');
        }
      } else {
        // Desktop testing fallback or Android device orientation (permission-less)
        if (typeof DeviceOrientationEvent !== 'undefined') {
          enableOrientationListener();
        } else {
          alert('DeviceOrientation is not supported by this browser/device.');
        }
      }
    }

    function enableOrientationListener() {
      window.addEventListener('deviceorientation', handleOrientation);
      isTracking = true;
      trackBtn.classList.add('active');
      trackBtnText.innerText = 'Tracking active';
      updateStatus('streaming', 'Streaming');
      deviceInfo.innerText = 'Streaming device orientation...';
    }

    function stopTracking() {
      window.removeEventListener('deviceorientation', handleOrientation);
      isTracking = false;
      trackBtn.classList.remove('active');
      trackBtnText.innerText = 'Enable Motion';
      if (activeConn && activeConn.open) {
        updateStatus('connected', 'Connected');
        deviceInfo.innerText = 'Tracking paused.';
      } else {
        updateStatus('disconnected', 'Disconnected');
        deviceInfo.innerText = 'Sensors inactive';
      }
      
      // Reset displays
      document.getElementById('val-alpha').innerText = '0°';
      document.getElementById('val-beta').innerText = '0°';
      document.getElementById('val-gamma').innerText = '0°';
    }

    function handleOrientation(event) {
      if (!isTracking) return;
      
      // Alpha: rotation around z-axis [0, 360]
      // Beta: rotation around x-axis [-180, 180]
      // Gamma: rotation around y-axis [-90, 90]
      orientationData.alpha = event.alpha || 0;
      orientationData.beta = event.beta || 0;
      orientationData.gamma = event.gamma || 0;

      // Update UI numbers
      document.getElementById('val-alpha').innerText = Math.round(orientationData.alpha) + '°';
      document.getElementById('val-beta').innerText = Math.round(orientationData.beta) + '°';
      document.getElementById('val-gamma').innerText = Math.round(orientationData.gamma) + '°';
    }

    // Stream loop using requestAnimationFrame for smooth 60fps limit
    function streamLoop(timestamp) {
      if (isTracking && activeConn && activeConn.open) {
        if (timestamp - lastSentTime > 16.67) { // 16.67ms is roughly 60 FPS
          activeConn.send({
            type: 'orientation',
            alpha: orientationData.alpha,
            beta: orientationData.beta,
            gamma: orientationData.gamma
          });
          lastSentTime = timestamp;
        }
      }
      requestAnimationFrame(streamLoop);
    }
    
    // Start animation loop
    requestAnimationFrame(streamLoop);

    // Screen Mirroring Setup
    const shareBtn = document.getElementById('share-btn');
    const shareBtnText = document.getElementById('share-btn-text');
    let screenStream = null;
    let screenVideo = null;
    let screenInterval = null;

    shareBtn.addEventListener('click', async () => {
      if (screenStream) {
        stopScreenShare();
      } else {
        stopCameraShare(); // Stop camera if active
        await startScreenShare();
      }
    });

    async function startScreenShare() {
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: false
        });

        screenVideo = document.createElement('video');
        screenVideo.srcObject = screenStream;
        screenVideo.autoplay = true;
        screenVideo.playsInline = true;

        screenVideo.onloadedmetadata = () => {
          screenVideo.play();
          startStreamingScreen();
        };

        // Try direct WebRTC MediaStream call if peer is ready
        if (peer && room) {
          try {
            if (activeCall) activeCall.close();
            activeCall = peer.call('appshowcase-' + room, screenStream);
          } catch(e) {
            console.log('Direct call fallback to canvas streaming:', e);
          }
        }

        shareBtn.classList.add('active');
        shareBtnText.innerText = 'Sharing Screen';
        shareBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
        shareBtn.style.boxShadow = '0 0 25px rgba(16, 185, 129, 0.5)';
        
        // Handle screen share stopped via browser native stop button
        screenStream.getVideoTracks()[0].onended = () => {
          stopScreenShare();
        };
      } catch (err) {
        console.error('Error starting screen share:', err);
        alert(`Could not start screen share.\nError: ${err.name} - ${err.message}\n\nPlease ensure you are running on a secure HTTPS link, using standard Safari/Chrome (not an in-app QR scanner browser), and that your device supports screen recording.`);
        stopScreenShare();
      }
    }

    function startStreamingScreen() {
      const streamCanvas = document.createElement('canvas');
      streamCanvas.width = 360;
      streamCanvas.height = 640;
      const ctx = streamCanvas.getContext('2d');

      screenInterval = setInterval(() => {
        if (activeConn && activeConn.open && screenStream && screenVideo.readyState >= 2) {
          ctx.drawImage(screenVideo, 0, 0, streamCanvas.width, streamCanvas.height);
          streamCanvas.toBlob((blob) => {
            if (blob && activeConn && activeConn.open) {
              activeConn.send(blob);
            }
          }, 'image/jpeg', 0.55); // 55% JPEG compression is highly optimized
        }
      }, 100); // 10 FPS (100ms interval) is lightweight and fluid
    }

    function stopScreenShare() {
      if (activeCall) {
        try { activeCall.close(); } catch(e) {}
        activeCall = null;
      }
      if (screenInterval) {
        clearInterval(screenInterval);
        screenInterval = null;
      }
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }
      if (screenVideo) {
        screenVideo.srcObject = null;
        screenVideo = null;
      }
      shareBtn.classList.remove('active');
      shareBtnText.innerText = 'Share Screen';
      shareBtn.style.background = 'linear-gradient(135deg, #a855f7 0%, #7e22ce 100%)';
      shareBtn.style.boxShadow = '0 0 20px rgba(168, 85, 247, 0.4)';
    }

    // Camera Sharing Setup
    const cameraBtn = document.getElementById('camera-btn');
    const cameraBtnText = document.getElementById('camera-btn-text');
    let cameraStream = null;
    let cameraVideo = null;
    let cameraInterval = null;

    cameraBtn.addEventListener('click', async () => {
      if (cameraStream) {
        stopCameraShare();
      } else {
        stopScreenShare(); // Stop screen share if active
        await startCameraShare();
      }
    });

    async function startCameraShare() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment', // Use rear camera by default
            width: { ideal: 480 },
            height: { ideal: 640 }
          },
          audio: false
        });

        cameraVideo = document.createElement('video');
        cameraVideo.srcObject = cameraStream;
        cameraVideo.autoplay = true;
        cameraVideo.playsInline = true;

        cameraVideo.onloadedmetadata = () => {
          cameraVideo.play();
          startStreamingCamera();
        };

        // Try direct WebRTC MediaStream call if peer is ready
        if (peer && room) {
          try {
            if (activeCall) activeCall.close();
            activeCall = peer.call('appshowcase-' + room, cameraStream);
          } catch(e) {
            console.log('Direct call fallback to canvas streaming:', e);
          }
        }

        cameraBtn.classList.add('active');
        cameraBtnText.innerText = 'Sharing Camera';
        cameraBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
        cameraBtn.style.boxShadow = '0 0 25px rgba(16, 185, 129, 0.5)';
      } catch (err) {
        console.error('Error starting camera share:', err);
        alert(`Could not access camera.\nError: ${err.name} - ${err.message}\n\nPlease ensure you grant camera permissions.`);
        stopCameraShare();
      }
    }

    function startStreamingCamera() {
      const streamCanvas = document.createElement('canvas');
      streamCanvas.width = 360;
      streamCanvas.height = 480;
      const ctx = streamCanvas.getContext('2d');

      cameraInterval = setInterval(() => {
        if (activeConn && activeConn.open && cameraStream && cameraVideo.readyState >= 2) {
          ctx.drawImage(cameraVideo, 0, 0, streamCanvas.width, streamCanvas.height);
          streamCanvas.toBlob((blob) => {
            if (blob && activeConn && activeConn.open) {
              activeConn.send(blob);
            }
          }, 'image/jpeg', 0.55); // Stream at 55% quality
        }
      }, 100); // 10 FPS
    }

    function stopCameraShare() {
      if (activeCall) {
        try { activeCall.close(); } catch(e) {}
        activeCall = null;
      }
      if (cameraInterval) {
        clearInterval(cameraInterval);
        cameraInterval = null;
      }
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      if (cameraVideo) {
        cameraVideo.srcObject = null;
        cameraVideo = null;
      }
      cameraBtn.classList.remove('active');
      cameraBtnText.innerText = 'Share Camera';
      cameraBtn.style.background = 'linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)';
      cameraBtn.style.boxShadow = '0 0 20px rgba(59, 130, 246, 0.4)';
    }
  </script>
</body>
</html>
