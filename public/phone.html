<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OMGMimiq Controller</title>
  <link rel="stylesheet" href="/style.css">
  <!-- PeerJS CDN for WebRTC P2P Sync -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="mobile-page">
  <div class="mobile-container">
    <!-- Main Controller Card -->
    <div class="mobile-card">
      <!-- Status Badge & Disconnect Button -->
      <div class="status-bar" style="justify-content: space-between; align-items: center; width: 100%;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="status-dot disconnected" id="status-dot"></span>
          <span id="status-text" style="font-weight: 600;">Disconnected</span>
        </div>
        <button id="phone-disconnect-btn" class="btn-disconnect" style="display: none;" title="Disconnect from session">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          Disconnect
        </button>
      </div>

      <!-- Pairing Section -->
      <div id="pairing-section" class="control-group">
        <label class="control-label">
          <span class="icon-label">
            <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Pairing Code
          </span>
        </label>
        <div class="pairing-input-container">
          <input type="text" id="room-input" class="pairing-input" placeholder="e.g. 1234" maxlength="4" pattern="[0-9]*" inputmode="numeric">
          <button id="connect-btn" class="btn btn-primary" style="width: auto; padding: 10px 20px;">
            <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            Pair
          </button>
        </div>
      </div>

      <!-- Enable Tracking & Screen Share Buttons (Visible after connected) -->
      <div id="tracking-section" style="display: none; flex-direction: column; gap: 12px; align-items: stretch; width: 100%;">
        <!-- Motion Tracking Button -->
        <button id="track-btn" class="controller-tile-btn">
          <div class="controller-tile-header">
            <div class="controller-tile-title-group">
              <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <ellipse cx="12" cy="12" rx="4" ry="10"></ellipse>
                <line x1="2" y1="12" x2="22" y2="12"></line>
              </svg>
              <span class="controller-tile-title">Motion Sensor</span>
            </div>
            <span class="controller-indicator" id="track-indicator">STANDBY</span>
          </div>
          <span class="controller-tile-desc" id="track-btn-text">Enable Motion</span>
        </button>

        <!-- Recalibrate Center Button -->
        <button id="phone-calibrate-btn" class="btn btn-secondary" style="display: none; width: 100%; padding: 12px; font-size: 0.85rem; border-radius: 0;">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="22" y1="12" x2="18" y2="12"></line>
            <line x1="6" y1="12" x2="2" y2="12"></line>
            <line x1="12" y1="6" x2="12" y2="2"></line>
            <line x1="12" y1="22" x2="12" y2="18"></line>
          </svg>
          Recalibrate Center View
        </button>

        <!-- Media Sharing Buttons -->
        <div style="display: flex; gap: 10px; width: 100%;">
          <button id="share-btn" class="controller-tile-btn" style="flex: 1;">
            <div class="controller-tile-header">
              <div class="controller-tile-title-group">
                <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="3" width="20" height="14"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span class="controller-tile-title">Screen</span>
              </div>
            </div>
            <span class="controller-tile-desc" id="share-btn-text">Share Screen</span>
          </button>

          <button id="camera-btn" class="controller-tile-btn" style="flex: 1;">
            <div class="controller-tile-header">
              <div class="controller-tile-title-group">
                <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="23 7 16 12 23 17 23 7"></polygon>
                  <rect x="1" y="5" width="15" height="14"></rect>
                </svg>
                <span class="controller-tile-title">Camera</span>
              </div>
            </div>
            <span class="controller-tile-desc" id="camera-btn-text">Share Camera</span>
          </button>
        </div>
        <p class="subtitle" style="text-align: center; margin: 4px 0 0 0; justify-content: center;">Tap controls to toggle real-time sync</p>
      </div>

      <!-- Remote Control Features Section (Visible after connected) -->
      <div id="remote-control-section" style="display: none; flex-direction: column; gap: 16px; width: 100%;">
        
        <!-- 2. Screen Presentation Source -->
        <div class="panel">
          <span class="panel-title">
            <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            <span>Screen Presentation Source</span>
          </span>
          
          <div class="control-group">
            <label class="control-label">
              <span class="icon-label">
                <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="3" width="20" height="14"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                Source Type
              </span>
            </label>
            <select id="mobile-source-select">
              <option value="clock">Dynamic Screen</option>
              <option value="image">Custom Screenshot</option>
              <option value="video">Custom Video</option>
            </select>
          </div>

          <!-- Custom Image Upload -->
          <div class="control-group" id="mobile-image-group" style="display: none;">
            <label class="control-label">
              <span class="icon-label">
                <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                Upload Screenshot to 3D Screen
              </span>
            </label>
            <div class="btn btn-secondary file-upload-btn">
              <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>Choose Photo...</span>
              <input type="file" id="mobile-image-input" accept="image/*">
            </div>
            <span class="subtitle" id="mobile-image-name" style="text-align: center; justify-content: center;">No photo chosen</span>
          </div>

          <!-- Custom Video Upload -->
          <div class="control-group" id="mobile-video-group" style="display: none;">
            <label class="control-label">
              <span class="icon-label">
                <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="23 7 16 12 23 17 23 7"></polygon>
                  <rect x="1" y="5" width="15" height="14"></rect>
                </svg>
                Upload Demo Video to 3D Screen
              </span>
            </label>
            <div class="btn btn-secondary file-upload-btn">
              <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>Choose Video...</span>
              <input type="file" id="mobile-video-input" accept="video/mp4,video/quicktime,video/webm">
            </div>
            <span class="subtitle" id="mobile-video-name" style="text-align: center; justify-content: center;">No video chosen</span>
          </div>
        </div>

        <!-- 4. iPhone 17 Pro Finish & Staging -->
        <div class="panel">
          <span class="panel-title">
            <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a10 10 0 0 1 10 10H2a10 10 0 0 1 10-10z"></path>
            </svg>
            <span>iPhone 17 Pro Finish &amp; Staging</span>
          </span>
          
          <div class="control-group">
            <label class="control-label">
              <span class="icon-label">
                <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="13.5" cy="6.5" r=".5"></circle>
                  <circle cx="17.5" cy="10.5" r=".5"></circle>
                  <circle cx="8.5" cy="7.5" r=".5"></circle>
                  <circle cx="6.5" cy="12.5" r=".5"></circle>
                  <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.562C22 6.5 17.5 2 12 2z"></path>
                </svg>
                Titanium Finish
              </span>
            </label>
            <div class="finish-swatches" id="mobile-finish-picker">
              <div class="finish-chip active" data-finish="natural" title="Natural Titanium">
                <div class="finish-dot" style="background: linear-gradient(135deg, #a8a49d, #78746e);"></div>
                <span>Natural</span>
              </div>
              <div class="finish-chip" data-finish="desert" title="Desert Titanium">
                <div class="finish-dot" style="background: linear-gradient(135deg, #cfb799, #9e8568);"></div>
                <span>Desert</span>
              </div>
              <div class="finish-chip" data-finish="black" title="Black Titanium">
                <div class="finish-dot" style="background: linear-gradient(135deg, #3d3e42, #1c1d20);"></div>
                <span>Black</span>
              </div>
              <div class="finish-chip" data-finish="teal" title="Deep Teal Titanium">
                <div class="finish-dot" style="background: linear-gradient(135deg, #385661, #18272d);"></div>
                <span>Teal</span>
              </div>
              <div class="finish-chip" data-finish="white" title="White Titanium">
                <div class="finish-dot" style="background: linear-gradient(135deg, #f0f2f5, #b8bac0);"></div>
                <span>White</span>
              </div>
            </div>
          </div>

          <div class="control-group" style="margin-top: 6px;">
            <label class="control-label">
              <span class="icon-label">
                <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                Studio Background Style
              </span>
            </label>
            <select id="mobile-bg-preset">
              <option value="dark-slate">Studio Dark (Default)</option>
              <option value="minimal-light">Studio Soft Light</option>
              <option value="pure-black">OLED Pure Black</option>
            </select>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const roomInput = document.getElementById('room-input');
    const connectBtn = document.getElementById('connect-btn');
    const pairingSection = document.getElementById('pairing-section');
    const trackingSection = document.getElementById('tracking-section');
    const trackBtn = document.getElementById('track-btn');
    const trackBtnText = document.getElementById('track-btn-text');
    const phoneCalibrateBtn = document.getElementById('phone-calibrate-btn');
    const phoneDisconnectBtn = document.getElementById('phone-disconnect-btn');
    const deviceInfo = document.getElementById('device-info') || { set innerText(_) {} };

    // Remote Control Elements
    const remoteControlSection = document.getElementById('remote-control-section');
    const mobileSourceSelect = document.getElementById('mobile-source-select');
    const mobileImageGroup = document.getElementById('mobile-image-group');
    const mobileImageInput = document.getElementById('mobile-image-input');
    const mobileImageName = document.getElementById('mobile-image-name');
    const mobileVideoGroup = document.getElementById('mobile-video-group');
    const mobileVideoInput = document.getElementById('mobile-video-input');
    const mobileVideoName = document.getElementById('mobile-video-name');
    const mobileFinishPicker = document.getElementById('mobile-finish-picker');
    const mobileBgPreset = document.getElementById('mobile-bg-preset');

    let cachedImageDataUrl = null;
    let cachedVideoDataUrl = null;

    let peer = null;
    let activeConn = null;
    let activeCall = null;
    let room = '';
    let isTracking = false;
    let orientationData = { alpha: 0, beta: 0, gamma: 0 };
    let lastSentTime = 0;

    function updateStatus(state, message) {
      statusDot.className = 'status-dot';
      statusDot.classList.add(state);
      statusText.innerText = message || state.charAt(0).toUpperCase() + state.slice(1);
    }

    function initPeer() {
      if (typeof Peer === 'undefined') {
        console.warn('PeerJS library loading, retrying in 300ms...');
        setTimeout(initPeer, 300);
        return;
      }

      if (peer && !peer.destroyed) return;

      peer = new Peer({
        debug: 1
      });

      peer.on('open', (id) => {
        console.log('Mobile PeerJS initialized with ID:', id);
        if (room && (!activeConn || !activeConn.open)) {
          connectToDesktop();
        }
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        updateStatus('disconnected', 'Signal Error');
        connectBtn.disabled = false;
        roomInput.disabled = false;
      });
    }

    // Extract room ID from URL (supports /pair/1234, /remote/1234, ?room=1234, or #1234)
    let extractedRoom = null;

    // 1. Check Path parameter: e.g. /pair/7710, /remote/7710, /phone/7710
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    if (pathSegments.length >= 2) {
      const lastSegment = pathSegments[pathSegments.length - 1];
      if (/^[A-Za-z0-9]{4}$/.test(lastSegment)) {
        extractedRoom = lastSegment;
      }
    }

    // 2. Check Query parameter: ?room=7710, ?code=7710, ?r=7710
    if (!extractedRoom) {
      const urlParams = new URLSearchParams(window.location.search);
      extractedRoom = urlParams.get('room') || urlParams.get('code') || urlParams.get('r');
    }

    // 3. Check Hash: #7710
    if (!extractedRoom && window.location.hash) {
      const hash = window.location.hash.replace('#', '').trim();
      if (/^[A-Za-z0-9]{4}$/.test(hash)) {
        extractedRoom = hash;
      }
    }

    if (extractedRoom) {
      roomInput.value = extractedRoom.substring(0, 4);
      room = extractedRoom.substring(0, 4).toUpperCase();
    }

    // Initialize peer signaling client on load
    initPeer();

    connectBtn.addEventListener('click', () => {
      connectToDesktop();
    });

    function getDeviceName() {
      const ua = navigator.userAgent;
      if (/iPhone/i.test(ua)) return 'iPhone Controller';
      if (/iPad/i.test(ua)) return 'Apple iPad';
      if (/Android/i.test(ua)) return 'Android Device';
      return 'OMGMimiq Controller';
    }

    function connectToDesktop() {
      room = roomInput.value.trim().toUpperCase();
      if (!room || room.length !== 4) {
        alert('Please enter a valid 4-digit pairing code.');
        return;
      }

      if (!peer || peer.destroyed || !peer.id) {
        initPeer();
        updateStatus('connecting', 'Connecting signal...');
        return;
      }

      const targetPeerId = 'omgmimiq-' + room;
      updateStatus('connecting', 'Connecting...');
      connectBtn.disabled = true;
      roomInput.disabled = true;

      try {
        if (activeConn) {
          activeConn.close();
        }

        activeConn = peer.connect(targetPeerId, {
          reliable: false // Ultra-low latency for sensor streaming
        });

        activeConn.on('open', () => {
          console.log('Connected to desktop peer, awaiting approval:', targetPeerId);
          updateStatus('connecting', 'Waiting for Host...');
          pairingSection.style.display = 'none';
          trackingSection.style.display = 'none';
          if (remoteControlSection) remoteControlSection.style.display = 'none';
          if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'none';
          deviceInfo.innerText = 'Pairing request sent. Waiting for host to approve...';

          // Send pair request with device name
          activeConn.send({
            type: 'pair_request',
            device: getDeviceName()
          });
        });

        activeConn.on('data', (data) => {
          let payload = data;
          if (typeof data === 'string') {
            try { payload = JSON.parse(data); } catch(e) {}
          }

          if (payload && payload.type === 'pair_accepted') {
            console.log('Host accepted pairing request!');
            document.body.classList.add('is-paired');
            updateStatus('connected', 'Connected');
            pairingSection.style.display = 'none';
            trackingSection.style.display = 'flex';
            if (remoteControlSection) remoteControlSection.style.display = 'flex';
            if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'inline-block';
            deviceInfo.innerText = 'Connected via WebRTC. Ready to stream.';

            if (payload.state) {
              applySyncState(payload.state);
            }
          } else if (payload && (payload.type === 'sync_state' || payload.type === 'theme_changed')) {
            applySyncState(payload);
          } else if (payload && payload.type === 'pair_rejected') {
            console.log('Host rejected pairing request.');
            document.body.classList.remove('is-paired');
            updateStatus('disconnected', 'Declined by Host');
            pairingSection.style.display = 'block';
            trackingSection.style.display = 'none';
            if (remoteControlSection) remoteControlSection.style.display = 'none';
            if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'none';
            connectBtn.disabled = false;
            roomInput.disabled = false;
            deviceInfo.innerText = 'Connection request was declined by host.';
            stopTracking();
            stopScreenShare();
            stopCameraShare();
          } else if (payload && payload.type === 'disconnect') {
            console.log('Host disconnected session.');
            document.body.classList.remove('is-paired');
            updateStatus('disconnected', 'Disconnected');
            pairingSection.style.display = 'block';
            trackingSection.style.display = 'none';
            if (remoteControlSection) remoteControlSection.style.display = 'none';
            if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'none';
            connectBtn.disabled = false;
            roomInput.disabled = false;
            deviceInfo.innerText = 'Session disconnected by host.';
            stopTracking();
            stopScreenShare();
            stopCameraShare();
          }
        });

        activeConn.on('close', () => {
          console.log('Peer connection closed');
          document.body.classList.remove('is-paired');
          updateStatus('disconnected', 'Disconnected');
          pairingSection.style.display = 'block';
          trackingSection.style.display = 'none';
          if (remoteControlSection) remoteControlSection.style.display = 'none';
          if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'none';
          connectBtn.disabled = false;
          roomInput.disabled = false;
          deviceInfo.innerText = 'Connection lost. Try reconnecting.';
          stopTracking();
          stopScreenShare();
          stopCameraShare();
        });

        activeConn.on('error', (err) => {
          console.error('DataConnection error:', err);
          updateStatus('disconnected', 'Connection Error');
          if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'none';
          connectBtn.disabled = false;
          roomInput.disabled = false;
        });

      } catch (e) {
        console.error('Failed to connect:', e);
        updateStatus('disconnected', 'Failed to connect');
        if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'none';
        connectBtn.disabled = false;
        roomInput.disabled = false;
      }
    }

    function disconnectFromHost() {
      if (activeConn && activeConn.open) {
        try {
          activeConn.send({ type: 'disconnect' });
        } catch (e) {}
        setTimeout(() => {
          try { activeConn.close(); } catch(e) {}
          activeConn = null;
        }, 60);
      }
      document.body.classList.remove('is-paired');
      stopTracking();
      stopScreenShare();
      stopCameraShare();
      updateStatus('disconnected', 'Disconnected');
      pairingSection.style.display = 'block';
      trackingSection.style.display = 'none';
      if (remoteControlSection) remoteControlSection.style.display = 'none';
      if (phoneDisconnectBtn) phoneDisconnectBtn.style.display = 'none';
      connectBtn.disabled = false;
      roomInput.disabled = false;
      deviceInfo.innerText = 'You disconnected from the session.';
    }

    if (phoneDisconnectBtn) {
      phoneDisconnectBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to disconnect?')) {
          disconnectFromHost();
        }
      });
    }

    // Motion Tracking Management
    trackBtn.addEventListener('click', () => {
      if (isTracking) {
        stopTracking();
      } else {
        startTracking();
      }
    });

    async function startTracking() {
      // Check for iOS 13+ permission requirements
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            enableOrientationListener();
          } else {
            alert('Sensor permission denied. Rotation tracking disabled.');
          }
        } catch (error) {
          console.error('Error requesting permission:', error);
          alert('Sensor permission request must be initiated by user gesture. Please try clicking the button again.');
        }
      } else {
        // Desktop testing fallback or Android device orientation (permission-less)
        if (typeof DeviceOrientationEvent !== 'undefined') {
          enableOrientationListener();
        } else {
          alert('DeviceOrientation is not supported by this browser/device.');
        }
      }
    }

    function enableOrientationListener() {
      window.addEventListener('deviceorientation', handleOrientation);
      isTracking = true;
      trackBtn.classList.add('active');
      trackBtnText.innerText = 'Tracking active';
      const trackIndicator = document.getElementById('track-indicator');
      if (trackIndicator) trackIndicator.innerText = 'LIVE';
      if (phoneCalibrateBtn) phoneCalibrateBtn.style.display = 'inline-flex';
      updateStatus('streaming', 'Streaming');
      deviceInfo.innerText = 'Streaming device orientation...';
    }

    function stopTracking() {
      window.removeEventListener('deviceorientation', handleOrientation);
      isTracking = false;
      trackBtn.classList.remove('active');
      trackBtnText.innerText = 'Enable Motion';
      const trackIndicator = document.getElementById('track-indicator');
      if (trackIndicator) trackIndicator.innerText = 'STANDBY';
      if (phoneCalibrateBtn) phoneCalibrateBtn.style.display = 'none';
      if (activeConn && activeConn.open) {
        updateStatus('connected', 'Connected');
        deviceInfo.innerText = 'Tracking paused.';
      } else {
        updateStatus('disconnected', 'Disconnected');
        deviceInfo.innerText = 'Sensors inactive';
      }
      
      // Reset displays
      const elA = document.getElementById('val-alpha');
      const elB = document.getElementById('val-beta');
      const elG = document.getElementById('val-gamma');
      if (elA) elA.innerText = '0°';
      if (elB) elB.innerText = '0°';
      if (elG) elG.innerText = '0°';
    }

    if (phoneCalibrateBtn) {
      phoneCalibrateBtn.addEventListener('click', () => {
        if (activeConn && activeConn.open) {
          activeConn.send({ type: 'recalibrate' });
          deviceInfo.innerText = 'Center position recalibrated!';
          setTimeout(() => {
            if (isTracking) deviceInfo.innerText = 'Streaming device orientation...';
          }, 1500);
        }
      });
    }

    function handleOrientation(event) {
      if (!isTracking) return;
      
      // Alpha: rotation around z-axis [0, 360]
      // Beta: rotation around x-axis [-180, 180]
      // Gamma: rotation around y-axis [-90, 90]
      orientationData.alpha = event.alpha || 0;
      orientationData.beta = event.beta || 0;
      orientationData.gamma = event.gamma || 0;

      // Update UI numbers
      const elA = document.getElementById('val-alpha');
      const elB = document.getElementById('val-beta');
      const elG = document.getElementById('val-gamma');
      if (elA) elA.innerText = Math.round(orientationData.alpha) + '°';
      if (elB) elB.innerText = Math.round(orientationData.beta) + '°';
      if (elG) elG.innerText = Math.round(orientationData.gamma) + '°';
    }

    // Stream loop using requestAnimationFrame for smooth 60fps limit
    function streamLoop(timestamp) {
      if (isTracking && activeConn && activeConn.open) {
        if (timestamp - lastSentTime > 16.67) { // 16.67ms is roughly 60 FPS
          activeConn.send({
            type: 'orientation',
            alpha: orientationData.alpha,
            beta: orientationData.beta,
            gamma: orientationData.gamma
          });
          lastSentTime = timestamp;
        }
      }
      requestAnimationFrame(streamLoop);
    }
    
    // Start animation loop
    requestAnimationFrame(streamLoop);

    // Screen Mirroring Setup
    const shareBtn = document.getElementById('share-btn');
    const shareBtnText = document.getElementById('share-btn-text');
    let screenStream = null;
    let screenVideo = null;
    let screenInterval = null;

    shareBtn.addEventListener('click', async () => {
      if (screenStream) {
        stopScreenShare();
      } else {
        stopCameraShare(); // Stop camera if active
        await startScreenShare();
      }
    });

    async function startScreenShare() {
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: false
        });

        screenVideo = document.createElement('video');
        screenVideo.srcObject = screenStream;
        screenVideo.autoplay = true;
        screenVideo.playsInline = true;

        screenVideo.onloadedmetadata = () => {
          screenVideo.play();
          startStreamingScreen();
        };

        // Try direct WebRTC MediaStream call if peer is ready
        if (peer && room) {
          try {
            if (activeCall) activeCall.close();
            activeCall = peer.call('omgmimiq-' + room, screenStream);
          } catch(e) {
            console.log('Direct call fallback to canvas streaming:', e);
          }
        }

        shareBtn.classList.add('active');
        shareBtnText.innerText = 'Stop Share';
        
        // Handle screen share stopped via browser native stop button
        screenStream.getVideoTracks()[0].onended = () => {
          stopScreenShare();
        };
      } catch (err) {
        console.error('Error starting screen share:', err);
        alert(`Could not start screen share.\nError: ${err.name} - ${err.message}\n\nPlease ensure you are running on a secure HTTPS link, using standard Safari/Chrome (not an in-app QR scanner browser), and that your device supports screen recording.`);
        stopScreenShare();
      }
    }

    function startStreamingScreen() {
      const streamCanvas = document.createElement('canvas');
      streamCanvas.width = 360;
      streamCanvas.height = 640;
      const ctx = streamCanvas.getContext('2d');

      screenInterval = setInterval(() => {
        if (activeConn && activeConn.open && screenStream && screenVideo.readyState >= 2) {
          ctx.drawImage(screenVideo, 0, 0, streamCanvas.width, streamCanvas.height);
          streamCanvas.toBlob((blob) => {
            if (blob && activeConn && activeConn.open) {
              activeConn.send(blob);
            }
          }, 'image/jpeg', 0.55); // 55% JPEG compression is highly optimized
        }
      }, 100); // 10 FPS (100ms interval) is lightweight and fluid
    }

    function stopScreenShare() {
      if (activeCall) {
        try { activeCall.close(); } catch(e) {}
        activeCall = null;
      }
      if (screenInterval) {
        clearInterval(screenInterval);
        screenInterval = null;
      }
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }
      if (screenVideo) {
        screenVideo.srcObject = null;
        screenVideo = null;
      }
      shareBtn.classList.remove('active');
      shareBtnText.innerText = 'Share Screen';
    }

    // Camera Sharing Setup
    const cameraBtn = document.getElementById('camera-btn');
    const cameraBtnText = document.getElementById('camera-btn-text');
    let cameraStream = null;
    let cameraVideo = null;
    let cameraInterval = null;

    cameraBtn.addEventListener('click', async () => {
      if (cameraStream) {
        stopCameraShare();
      } else {
        stopScreenShare(); // Stop screen share if active
        await startCameraShare();
      }
    });

    async function startCameraShare() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment', // Use rear camera by default
            width: { ideal: 480 },
            height: { ideal: 640 }
          },
          audio: false
        });

        cameraVideo = document.createElement('video');
        cameraVideo.srcObject = cameraStream;
        cameraVideo.autoplay = true;
        cameraVideo.playsInline = true;

        cameraVideo.onloadedmetadata = () => {
          cameraVideo.play();
          startStreamingCamera();
        };

        // Try direct WebRTC MediaStream call if peer is ready
        if (peer && room) {
          try {
            if (activeCall) activeCall.close();
            activeCall = peer.call('omgmimiq-' + room, cameraStream);
          } catch(e) {
            console.log('Direct call fallback to canvas streaming:', e);
          }
        }

        cameraBtn.classList.add('active');
        cameraBtnText.innerText = 'Stop Camera';
      } catch (err) {
        console.error('Error starting camera share:', err);
        alert(`Could not access camera.\nError: ${err.name} - ${err.message}\n\nPlease ensure you grant camera permissions.`);
        stopCameraShare();
      }
    }

    function startStreamingCamera() {
      const streamCanvas = document.createElement('canvas');
      streamCanvas.width = 360;
      streamCanvas.height = 480;
      const ctx = streamCanvas.getContext('2d');

      cameraInterval = setInterval(() => {
        if (activeConn && activeConn.open && cameraStream && cameraVideo.readyState >= 2) {
          ctx.drawImage(cameraVideo, 0, 0, streamCanvas.width, streamCanvas.height);
          streamCanvas.toBlob((blob) => {
            if (blob && activeConn && activeConn.open) {
              activeConn.send(blob);
            }
          }, 'image/jpeg', 0.55); // Stream at 55% quality
        }
      }, 100); // 10 FPS
    }

    function stopCameraShare() {
      if (activeCall) {
        try { activeCall.close(); } catch(e) {}
        activeCall = null;
      }
      if (cameraInterval) {
        clearInterval(cameraInterval);
        cameraInterval = null;
      }
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      if (cameraVideo) {
        cameraVideo.srcObject = null;
        cameraVideo = null;
      }
      cameraBtn.classList.remove('active');
      cameraBtnText.innerText = 'Share Camera';
    }

    // ----------------------------------------------------
    // Remote Presentation & Staging Controls
    // ----------------------------------------------------
    function applySyncState(state) {
      if (!state) return;
      if (state.finish) {
        document.querySelectorAll('#mobile-finish-picker .finish-chip').forEach(chip => {
          chip.classList.toggle('active', chip.getAttribute('data-finish') === state.finish);
        });
      }
      if (state.staging && mobileBgPreset) {
        mobileBgPreset.value = state.staging;
      }
      if (state.screenSource && mobileSourceSelect) {
        mobileSourceSelect.value = state.screenSource;
        if (mobileImageGroup) mobileImageGroup.style.display = state.screenSource === 'image' ? 'flex' : 'none';
        if (mobileVideoGroup) mobileVideoGroup.style.display = state.screenSource === 'video' ? 'flex' : 'none';
      }
    }

    if (mobileSourceSelect) {
      mobileSourceSelect.addEventListener('change', (e) => {
        const val = e.target.value;
        if (mobileImageGroup) mobileImageGroup.style.display = val === 'image' ? 'flex' : 'none';
        if (mobileVideoGroup) mobileVideoGroup.style.display = val === 'video' ? 'flex' : 'none';

        if (activeConn && activeConn.open) {
          if (val === 'image' && cachedImageDataUrl) {
            activeConn.send({ type: 'set_image', dataUrl: cachedImageDataUrl });
          } else if (val === 'video' && cachedVideoDataUrl) {
            activeConn.send({ type: 'set_video', dataUrl: cachedVideoDataUrl });
          } else {
            activeConn.send({ type: 'set_screen_source', source: val });
          }
        }
      });
    }

    if (mobileImageInput) {
      mobileImageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (mobileImageName) mobileImageName.innerText = file.name;
        
        const reader = new FileReader();
        reader.onload = () => {
          cachedImageDataUrl = reader.result;
          if (mobileSourceSelect) mobileSourceSelect.value = 'image';
          if (mobileImageGroup) mobileImageGroup.style.display = 'flex';
          if (activeConn && activeConn.open) {
            activeConn.send({ type: 'set_image', dataUrl: cachedImageDataUrl });
          }
        };
        reader.readAsDataURL(file);
      });
    }

    if (mobileVideoInput) {
      mobileVideoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (mobileVideoName) mobileVideoName.innerText = file.name;
        
        const reader = new FileReader();
        reader.onload = () => {
          cachedVideoDataUrl = reader.result;
          if (mobileSourceSelect) mobileSourceSelect.value = 'video';
          if (mobileVideoGroup) mobileVideoGroup.style.display = 'flex';
          if (activeConn && activeConn.open) {
            activeConn.send({ type: 'set_video', dataUrl: cachedVideoDataUrl });
          }
        };
        reader.readAsDataURL(file);
      });
    }

    document.querySelectorAll('#mobile-finish-picker .finish-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const finish = chip.getAttribute('data-finish');
        document.querySelectorAll('#mobile-finish-picker .finish-chip').forEach(c => {
          c.classList.toggle('active', c === chip);
        });
        if (finish && activeConn && activeConn.open) {
          activeConn.send({ type: 'set_finish', finish });
        }
      });
    });

    if (mobileBgPreset) {
      mobileBgPreset.addEventListener('change', (e) => {
        const preset = e.target.value;
        if (activeConn && activeConn.open) {
          activeConn.send({ type: 'set_staging', preset });
        }
      });
    }
  </script>
</body>
</html>
