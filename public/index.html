<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMGMimiq - 3D Motion Showcase</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Three.js, OrbitControls, and 3D Asset Loaders (GLTF, FBX, OBJ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <!-- QRCode.js CDN for pairing link -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- PeerJS CDN for WebRTC P2P Sync -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Main Viewport Canvas -->
    <div class="viewport-container">
      <div id="canvas-container"></div>
    </div>
  </div>

  <!-- Floating Pairing Connection Window (Top Left) -->
  <div class="panel floating-pairing-widget" id="pairing-panel">
    <div class="pairing-code-container">
      <span class="pairing-label" style="display: inline-flex; align-items: center; gap: 6px;">
        <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Pairing Code
      </span>
      <span class="pairing-code" id="display-room-code">----</span>
      <p class="subtitle" style="display: inline-flex; align-items: center; gap: 6px; margin-top: 2px;">
        <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        Scan QR code with mobile device:
      </p>
      <div id="qrcode"></div>
      <!-- Section to go to the pair page -->
      <div class="pair-page-section">
        <a id="go-to-pair-page-link" href="/phone.html" class="pairing-link-btn" title="Go to Pair Page">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          <span>Go to Pair Page</span>
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Floating Status Monitor Window (Bottom Left) -->
  <div id="status-monitor-widget" class="floating-status-widget">
    <div class="floating-status-header">
      <div class="floating-header-left">
        <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span class="floating-status-title">Status</span>
      </div>
      <div class="floating-header-actions">
        <button id="theme-toggle" class="widget-btn" title="Toggle Staging Theme">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          Theme
        </button>
        <button id="camera-reset" class="widget-btn" title="Reset Camera View">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="22" y1="12" x2="18" y2="12"></line>
            <line x1="6" y1="12" x2="2" y2="12"></line>
            <line x1="12" y1="6" x2="12" y2="2"></line>
            <line x1="12" y1="22" x2="12" y2="18"></line>
          </svg>
          Reset
        </button>
      </div>
    </div>
    <div class="status-row">
      <span class="status-label">
        <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        Connection:
      </span>
      <div class="status-indicator">
        <span class="status-dot disconnected" id="server-status-dot"></span>
        <span id="server-status-text">Connecting...</span>
      </div>
    </div>
    <div class="status-row">
      <span class="status-label">
        <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        Mobile Device:
      </span>
      <div class="status-val-group">
        <div class="status-indicator">
          <span class="status-dot disconnected" id="phone-status-dot"></span>
          <span id="phone-status-text">Not Paired</span>
        </div>
        <button id="disconnect-device-btn" class="btn-disconnect" title="Disconnect device">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          Disconnect
        </button>
      </div>
    </div>
  </div>

  <!-- Pairing Confirmation Modal (Host Approval) -->
  <div id="pair-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header-icon">
        <svg class="ui-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
      </div>
      <h3 class="modal-title">Device Pairing Request</h3>
      <p class="modal-desc">A mobile controller is requesting permission to connect and control OMGMimiq.</p>
      <div class="modal-device-badge">
        <svg class="ui-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span id="modal-device-name">Mobile Controller</span>
      </div>
      <div class="modal-actions">
        <button id="modal-reject-btn" class="btn btn-danger">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Decline
        </button>
        <button id="modal-accept-btn" class="btn btn-success">
          <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Allow & Pair
        </button>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // Configuration & State
    // ----------------------------------------------------
    const config = {
      sensitivity: 1.0,
      damping: 0.15,
      invertPitch: false,
      invertRoll: false,
      invertYaw: false
    };

    const calibration = {
      alpha: 0,
      beta: 0,
      gamma: 0,
      isSet: false
    };

    let peer = null;
    let activeConn = null;
    let roomCode = '';
    let targetRotation = new THREE.Quaternion();
    let isPhoneStreaming = false;
    let lastSensorActivity = 0;

    // Generate random 4-digit room code
    roomCode = Math.floor(1000 + Math.random() * 9000).toString();
    const roomCodeDisplay = document.getElementById('display-room-code');
    if (roomCodeDisplay) {
      roomCodeDisplay.innerText = roomCode;
    }

    // ----------------------------------------------------
    // QR Code Setup
    // ----------------------------------------------------
    function setupQRCode(host) {
      if (!roomCode) {
        roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      }
      const codeElem = document.getElementById('display-room-code');
      if (codeElem) {
        codeElem.innerText = roomCode;
      }

      const phoneUrl = `${window.location.protocol}//${host}/pair/${roomCode}`;

      const qrContainer = document.getElementById("qrcode");
      if (qrContainer && typeof QRCode !== 'undefined') {
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: phoneUrl,
          width: 150,
          height: 150,
          colorDark : "#0f172a",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.H
        });
      }
    }

    // Immediate initial QR code setup
    setupQRCode(window.location.host);

    // If accessed via localhost, check if network IP is available from local server
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      fetch('/api/config')
        .then(res => res.json())
        .then(data => {
          if (data && data.localIp && data.localIp !== '127.0.0.1') {
            setupQRCode(`${data.localIp}:${data.port}`);
          }
        })
        .catch(() => {
          // Graceful fallback already rendered
        });
    }

    // ----------------------------------------------------
    // UI Event Listeners
    // ----------------------------------------------------
    const serverDot = document.getElementById('server-status-dot');
    const serverText = document.getElementById('server-status-text');
    const phoneDot = document.getElementById('phone-status-dot');
    const phoneText = document.getElementById('phone-status-text');

    const sensitivitySlider = document.getElementById('sensitivity-slider');
    const sensitivityValue = document.getElementById('sensitivity-value');
    const dampingSlider = document.getElementById('damping-slider');
    const dampingValue = document.getElementById('damping-value');
    
    const invertPitch = document.getElementById('invert-pitch-checkbox');
    const invertRoll = document.getElementById('invert-roll-checkbox');
    const invertYaw = document.getElementById('invert-yaw-checkbox');
    
    const calibrateBtn = document.getElementById('calibrate-btn');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const cameraResetBtn = document.getElementById('camera-reset');
    
    const screenSourceSelect = document.getElementById('screen-source-select');
    const bgPresetSelect = document.getElementById('bg-preset-select');
    
    const imageUploadGroup = document.getElementById('image-upload-group');
    const imageFileInput = document.getElementById('image-file-input');
    const imageFileName = document.getElementById('image-file-name');
    
    const videoUploadGroup = document.getElementById('video-upload-group');
    const videoFileInput = document.getElementById('video-file-input');
    const videoFileName = document.getElementById('video-file-name');

    let currentStagingPreset = 'dark-slate';

    // Sync config state (if sliders present)
    if (sensitivitySlider) {
      sensitivitySlider.addEventListener('input', (e) => {
        config.sensitivity = parseFloat(e.target.value);
        if (sensitivityValue) sensitivityValue.innerText = config.sensitivity.toFixed(1) + 'x';
      });
    }

    if (dampingSlider) {
      dampingSlider.addEventListener('input', (e) => {
        config.damping = parseFloat(e.target.value);
        if (dampingValue) dampingValue.innerText = config.damping.toFixed(2);
      });
    }

    if (invertPitch) invertPitch.addEventListener('change', (e) => config.invertPitch = e.target.checked);
    if (invertRoll) invertRoll.addEventListener('change', (e) => config.invertRoll = e.target.checked);
    if (invertYaw) invertYaw.addEventListener('change', (e) => config.invertYaw = e.target.checked);

    if (calibrateBtn) {
      calibrateBtn.addEventListener('click', () => {
        calibration.isSet = false; // Trigger recalibration on next frame
        console.log('Recalibration queued.');
      });
    }

    // Theme logic
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        
        // Update environment colors in Three.js
        if (newTheme === 'light') {
          currentStagingPreset = 'minimal-light';
        } else {
          currentStagingPreset = 'dark-slate';
        }
        updateStagingEnvironment();

        if (activeConn && activeConn.open) {
          activeConn.send({ type: 'sync_state', staging: currentStagingPreset });
        }
      });
    }

    // Screen Source selector behavior (if present)
    if (screenSourceSelect) {
      screenSourceSelect.addEventListener('change', (e) => {
        if (imageUploadGroup) imageUploadGroup.style.display = 'none';
        if (videoUploadGroup) videoUploadGroup.style.display = 'none';
        stopLocalWindowShare(); // Always stop window sharing if we change source

        if (e.target.value === 'image') {
          if (imageUploadGroup) imageUploadGroup.style.display = 'flex';
          applyImageTexture();
        } else if (e.target.value === 'video') {
          if (videoUploadGroup) videoUploadGroup.style.display = 'flex';
          applyVideoTexture();
        } else if (e.target.value === 'mirror') {
          applyMirrorTexture();
        } else if (e.target.value === 'window') {
          applyWindowShareTexture();
        } else {
          applyClockTexture();
        }
      });
    }

    if (bgPresetSelect) {
      bgPresetSelect.addEventListener('change', () => {
        updateStagingEnvironment(bgPresetSelect.value);
      });
    }

    // Titanium finish switcher listener (if present)
    document.querySelectorAll('#titanium-finish-picker .finish-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const finish = chip.getAttribute('data-finish');
        if (finish && typeof setTitaniumFinish === 'function') {
          setTitaniumFinish(finish);
        }
      });
    });

    // File inputs listeners (if present)
    if (imageFileInput) {
      imageFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          if (imageFileName) imageFileName.innerText = file.name;
          applyImageTexture(file);
        }
      });
    }

    if (videoFileInput) {
      videoFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          if (videoFileName) videoFileName.innerText = file.name;
          applyVideoTexture(file);
        }
      });
    }

    // ----------------------------------------------------
    // WebRTC Peer Connection (PeerJS) & Host Approval System
    // ----------------------------------------------------
    let pendingConn = null;
    let isConfirmed = false;

    // Modal & Control elements
    const pairingPanel = document.getElementById('pairing-panel');
    const pairModal = document.getElementById('pair-modal');
    const modalDeviceName = document.getElementById('modal-device-name');
    const modalAcceptBtn = document.getElementById('modal-accept-btn');
    const modalRejectBtn = document.getElementById('modal-reject-btn');
    const disconnectBtn = document.getElementById('disconnect-device-btn');

    const sidebarElem = document.querySelector('.sidebar');
    function updatePairingVisibility(isPaired) {
      if (pairingPanel) {
        pairingPanel.style.display = isPaired ? 'none' : 'flex';
      }
      if (typeof onWindowResize === 'function') {
        setTimeout(onWindowResize, 60);
      }
    }

    if (modalAcceptBtn) {
      modalAcceptBtn.addEventListener('click', () => {
        if (pendingConn) {
          activeConn = pendingConn;
          pendingConn = null;
          isConfirmed = true;
          
          if (activeConn && activeConn.open) {
            activeConn.send({
              type: 'pair_accepted',
              state: {
                finish: currentFinish,
                staging: currentStagingPreset,
                screenSource: currentScreenType
              }
            });
          }
          
          if (pairModal) pairModal.classList.remove('active');
          if (phoneDot) phoneDot.className = 'status-dot connected';
          if (phoneText) phoneText.innerText = 'Paired';
          if (disconnectBtn) disconnectBtn.style.display = 'inline-block';
          updatePairingVisibility(true);
        }
      });
    }

    if (modalRejectBtn) {
      modalRejectBtn.addEventListener('click', () => {
        if (pendingConn) {
          try {
            pendingConn.send({ type: 'pair_rejected' });
            setTimeout(() => { try { pendingConn.close(); } catch(e){} pendingConn = null; }, 100);
          } catch (e) {}
        }
        isConfirmed = false;
        if (pairModal) pairModal.classList.remove('active');
        if (phoneDot) phoneDot.className = 'status-dot disconnected';
        if (phoneText) phoneText.innerText = 'Not Paired';
        if (disconnectBtn) disconnectBtn.style.display = 'none';
        updatePairingVisibility(false);
      });
    }

    if (disconnectBtn) {
      disconnectBtn.addEventListener('click', () => {
        if (activeConn) {
          try {
            activeConn.send({ type: 'disconnect' });
            setTimeout(() => { try { activeConn.close(); } catch(e){} activeConn = null; }, 100);
          } catch (e) {}
        }
        isConfirmed = false;
        if (phoneDot) phoneDot.className = 'status-dot disconnected';
        if (phoneText) phoneText.innerText = 'Not Paired';
        disconnectBtn.style.display = 'none';
        updatePairingVisibility(false);
        resetDeviceRotation();
      });
    }

    function initPeerConnection() {
      if (typeof Peer === 'undefined') {
        console.warn('PeerJS library loading, retrying in 300ms...');
        setTimeout(initPeerConnection, 300);
        return;
      }

      if (!roomCode) {
        roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      }
      const roomCodeElem = document.getElementById('display-room-code');
      if (roomCodeElem) {
        roomCodeElem.innerText = roomCode;
      }

      const peerId = 'omgmimiq-' + roomCode;

      if (serverDot) serverDot.className = 'status-dot connecting';
      if (serverText) serverText.innerText = 'Connecting...';

      try {
        if (peer && !peer.destroyed) {
          try { peer.destroy(); } catch(e) {}
        }

        peer = new Peer(peerId, {
          debug: 1
        });

        peer.on('open', (id) => {
          console.log('PeerJS signaling ready with ID:', id);
          serverDot.className = 'status-dot connected';
          serverText.innerText = 'Ready';
        });

        peer.on('connection', (conn) => {
          console.log('Incoming mobile connection from:', conn.peer);
          pendingConn = conn;
          isConfirmed = false;
          
          phoneDot.className = 'status-dot pending';
          phoneText.innerText = 'Approval Pending';
          if (modalDeviceName) modalDeviceName.innerText = 'Mobile Controller';
          if (pairModal) pairModal.classList.add('active');

          conn.on('data', (data) => {
            // Parse JSON if received
            let payload = data;
            if (typeof data === 'string') {
              try {
                payload = JSON.parse(data);
              } catch (e) {}
            }

            // Check for initial pair request with device name
            if (payload && payload.type === 'pair_request') {
              if (payload.device && modalDeviceName) {
                modalDeviceName.innerText = payload.device;
              }
              return;
            }

            // Only process motion / media stream data if host approved
            if (!isConfirmed) return;

            // Handle binary blob / ArrayBuffer for screen / camera mirror
            if (data instanceof Blob || data instanceof ArrayBuffer || (data && data.byteLength)) {
              if (currentScreenType === 'mirror') {
                const blob = (data instanceof Blob) ? data : new Blob([data], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                  if (canvasCtx && clockCanvasTexture) {
                    canvasCtx.drawImage(img, 0, 0, canvasElement.width, canvasElement.height);
                    clockCanvasTexture.needsUpdate = true;
                  }
                  URL.revokeObjectURL(url);
                };
                img.src = url;
              }
              return;
            }

            if (payload && payload.type === 'orientation') {
              lastSensorActivity = Date.now();
              if (!isPhoneStreaming) {
                isPhoneStreaming = true;
                phoneDot.className = 'status-dot streaming';
                phoneText.innerText = 'Streaming';
              }
              processOrientationData(payload.alpha, payload.beta, payload.gamma, payload.orient || 0);
            } else if (payload && payload.type === 'recalibrate') {
              calibration.isSet = false;
              console.log('Recalibration requested by mobile device.');
            } else if (payload && payload.type === 'set_screen_source') {
              const src = payload.source;
              console.log('Remote screen source requested:', src);
              if (src === 'image') {
                applyImageTexture(payload.dataUrl);
              } else if (src === 'video') {
                applyVideoTexture(payload.dataUrl);
              } else if (src === 'mirror') {
                applyMirrorTexture();
              } else {
                applyClockTexture();
              }
            } else if (payload && payload.type === 'set_image') {
              console.log('Remote screenshot received');
              applyImageTexture(payload.dataUrl);
            } else if (payload && payload.type === 'set_video') {
              console.log('Remote demo video received');
              applyVideoTexture(payload.dataUrl);
            } else if (payload && payload.type === 'set_finish') {
              console.log('Remote finish set:', payload.finish);
              setTitaniumFinish(payload.finish);
            } else if (payload && payload.type === 'set_staging') {
              console.log('Remote staging preset set:', payload.preset);
              updateStagingEnvironment(payload.preset);
            } else if (payload && payload.type === 'request_state') {
              if (activeConn && activeConn.open) {
                activeConn.send({
                  type: 'sync_state',
                  finish: currentFinish,
                  staging: currentStagingPreset,
                  screenSource: currentScreenType
                });
              }
            } else if (payload && (payload.type === 'disconnect' || (payload.type === 'status' && payload.message && payload.message.includes('disconnected')))) {
              phoneDot.className = 'status-dot disconnected';
              phoneText.innerText = 'Not Paired';
              isPhoneStreaming = false;
              if (disconnectBtn) disconnectBtn.style.display = 'none';
              updatePairingVisibility(false);
              resetDeviceRotation();
            }
          });

          conn.on('close', () => {
            console.log('Mobile peer connection closed.');
            if (pairModal) pairModal.classList.remove('active');
            if (conn === pendingConn) pendingConn = null;
            if (conn === activeConn) {
              activeConn = null;
              isConfirmed = false;
            }
            phoneDot.className = 'status-dot disconnected';
            phoneText.innerText = 'Not Paired';
            isPhoneStreaming = false;
            if (disconnectBtn) disconnectBtn.style.display = 'none';
            updatePairingVisibility(false);
            resetDeviceRotation();
          });

          conn.on('error', (err) => {
            console.error('DataChannel error:', err);
          });
        });

        // Also handle incoming WebRTC direct media calls (for screen / camera video streams)
        peer.on('call', (call) => {
          if (!isConfirmed) return;
          console.log('Incoming WebRTC media call');
          call.answer(); // Answer with no stream back
          call.on('stream', (remoteStream) => {
            console.log('Received remote media stream');
            const remoteVideo = document.createElement('video');
            remoteVideo.srcObject = remoteStream;
            remoteVideo.autoplay = true;
            remoteVideo.playsInline = true;
            remoteVideo.muted = true;
            remoteVideo.onloadedmetadata = () => {
              remoteVideo.play();
            };

            const streamToCanvas = () => {
              if (currentScreenType === 'mirror' && canvasCtx && remoteVideo.readyState >= 2 && clockCanvasTexture) {
                canvasCtx.drawImage(remoteVideo, 0, 0, canvasElement.width, canvasElement.height);
                clockCanvasTexture.needsUpdate = true;
              }
              if (remoteStream.active) {
                requestAnimationFrame(streamToCanvas);
              }
            };
            requestAnimationFrame(streamToCanvas);
          });
        });

        peer.on('error', (err) => {
          console.error('PeerJS error:', err);
          if (err.type === 'unavailable-id') {
            console.warn('Room ID collision, generating a new room code...');
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('display-room-code').innerText = roomCode;
            setupQRCode(window.location.host);

        });

        peer.on('disconnected', () => {
          console.log('Peer disconnected from signaling server, attempting reconnect...');
          serverDot.className = 'status-dot disconnected';
          serverText.innerText = 'Disconnected';
          if (!peer.destroyed) {

        serverText.innerText = 'Failed';
      }

    // ----------------------------------------------------
    // High-Fidelity 3D DeviceOrientation Kinematics Engine
    // ----------------------------------------------------
    const degToRad = Math.PI / 180;
    const _zee = new THREE.Vector3(0, 0, 1);
    const _eulerMath = new THREE.Euler();
    const _q0 = new THREE.Quaternion();
    const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90 deg around X (camera space alignment)
    const _identityQ = new THREE.Quaternion(0, 0, 0, 1);

    const calibQ = new THREE.Quaternion();
    const calibQInv = new THREE.Quaternion();

    function getDeviceQuaternion(alpha, beta, gamma, orient = 0) {
      const a = (alpha || 0) * degToRad; // Z (alpha)
      const b = (beta || 0) * degToRad;  // X (beta)
      const c = (gamma || 0) * degToRad; // Y (gamma)
      const o = (orient || 0) * degToRad;

      // 1. Convert W3C intrinsic rotation to Three.js
      _eulerMath.set(b, a, -c, 'YXZ');
      const q = new THREE.Quaternion().setFromEuler(_eulerMath);

      // 2. Rotate by -90 deg around X to align "flat on table" coordinate system to "upright in hand facing screen"
      q.multiply(_q1);

      // 3. Compensate for device screen rotation (portrait/landscape)
      if (o !== 0) {
        q.multiply(_q0.setFromAxisAngle(_zee, -o));
      }

      return q;
    }

    function processOrientationData(alpha, beta, gamma, orient = 0) {
      const currentQ = getDeviceQuaternion(alpha, beta, gamma, orient);

      // 1. Calibrate on initial payload or when recalibrate is clicked
      if (!calibration.isSet) {
        calibQ.copy(currentQ);
        calibQInv.copy(currentQ).invert();
        calibration.isSet = true;
        console.log('Calibrated 3D orientation baseline in camera space.');
      }

      // 2. Compute true 3D relative spatial difference: deltaQ = calibInv * currentQ
      const deltaQ = new THREE.Quaternion().multiplyQuaternions(calibQInv, currentQ);

      // 3. Apply axis inversions if requested
      if (config.invertPitch) deltaQ.x = -deltaQ.x;
      if (config.invertYaw) deltaQ.y = -deltaQ.y;
      if (config.invertRoll) deltaQ.z = -deltaQ.z;
      deltaQ.normalize();

      // 4. Sensitivity scaling via SLERP
      if (config.sensitivity === 1.0) {
        targetRotation.copy(deltaQ);
      } else {
        targetRotation.slerpQuaternions(_identityQ, deltaQ, config.sensitivity);
      }
    }

    function resetDeviceRotation() {
      targetRotation.set(0, 0, 0, 1);
    }

    // Check if phone sensor has timed out (stopped sending orientation events)
    setInterval(() => {

    // ----------------------------------------------------

    let isExternalModelActive = false;

    function updateAllScreenMeshes(tex) {
      if (tex) currentScreenTexture = tex;
      if (!currentScreenTexture) return;

      screenMaterialSlots.forEach(slot => {
        if (slot.isSingle) {
          if (!slot.mesh.material || !slot.mesh.material.isMeshBasicMaterial) {
            slot.mesh.material = new THREE.MeshBasicMaterial({
              map: currentScreenTexture,
              color: 0xffffff,
              side: THREE.DoubleSide
            });
          } else {
            slot.mesh.material.map = currentScreenTexture;
            slot.mesh.material.color.setHex(0xffffff);
            slot.mesh.material.needsUpdate = true;
          }
        } else if (Array.isArray(slot.mesh.material)) {
          const mat = slot.mesh.material[slot.index];
          if (!mat || !mat.isMeshBasicMaterial) {
            slot.mesh.material[slot.index] = new THREE.MeshBasicMaterial({
              map: currentScreenTexture,
              color: 0xffffff,
              side: THREE.DoubleSide
            });
          } else {
            mat.map = currentScreenTexture;
            mat.color.setHex(0xffffff);
            mat.needsUpdate = true;
          }
        }
      });
    }

    function setupLoadedModel(object, formatName) {
      console.log('✅ iPhone 17 Air 3D Model Loaded Successfully via', formatName, object);
      isExternalModelActive = true;
      if (phoneGroup) scene.remove(phoneGroup);

      loadedModelObject = object;
      phoneGroup = new THREE.Group();
      phoneGroup.add(loadedModelObject);

      // Force update of initial world matrices
      loadedModelObject.updateMatrixWorld(true);

      // 1. Reset horizontal X-offsets of all 4 variant root groups so they all share origin (0, 0, 0)
      loadedModelObject.children.forEach(rootChild => {
        rootChild.position.set(0, 0, 0);
      });
      loadedModelObject.updateMatrixWorld(true);

      // 2. Measure single variant bounding box
      const activeSampleNode = loadedModelObject.children[0] || loadedModelObject;
      const initialBox = new THREE.Box3().setFromObject(activeSampleNode);
      const initialSize = initialBox.getSize(new THREE.Vector3());

      // If the longest dimension is Z, rotate by -90 deg on X (Blender Z-up -> Three.js Y-up)
      if (initialSize.z > initialSize.y && initialSize.z > initialSize.x) {
        loadedModelObject.rotation.x = -Math.PI / 2;
        loadedModelObject.updateMatrixWorld(true);
      }

      // 3. Compute post-rotation bounding box & center
      const rotatedBox = new THREE.Box3().setFromObject(activeSampleNode);
      const rotatedSize = rotatedBox.getSize(new THREE.Vector3());
      const rotatedCenter = rotatedBox.getCenter(new THREE.Vector3());

      // Center the phone relative to phoneGroup
      loadedModelObject.children.forEach(rootChild => {
        rootChild.position.set(-rotatedCenter.x, -rotatedCenter.y, -rotatedCenter.z);
      });
      loadedModelObject.updateMatrixWorld(true);

      // 4. Scale phoneGroup so phone height is exactly 7.0 units
      const currentHeight = rotatedSize.y > 0 ? rotatedSize.y : 1.0;
      const targetHeight = 7.0;
      const scaleFactor = targetHeight / currentHeight;

      phoneGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);

      // 4. Configure materials, bind dynamic iOS display, and set up glass/reflectivity
      screenMaterialSlots = [];

      loadedModelObject.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.frustumCulled = false;

          const configureMat = (mat, idx, isSingle) => {
            if (!mat) return mat;
            const matName = (mat.name || '').toLowerCase();

            // Screen Display
            if (matName.includes('display') && !matName.includes('border')) {
              // Remap UV coordinates so texture perfectly matches physical screen bounds
              if (child.geometry && child.geometry.attributes && child.geometry.attributes.position) {
                const pos = child.geometry.attributes.position;
                const uvs = child.geometry.attributes.uv;
                if (pos && uvs) {
                  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                  for (let i = 0; i < pos.count; i++) {
                    const px = pos.getX(i);
                    const py = pos.getY(i);
                    if (px < minX) minX = px;
                    if (px > maxX) maxX = px;
                    if (py < minY) minY = py;
                    if (py > maxY) maxY = py;
                  }
                  const rangeX = maxX - minX > 0.001 ? (maxX - minX) : 2.54;
                  const rangeY = maxY - minY > 0.001 ? (maxY - minY) : 5.56;

                  for (let i = 0; i < pos.count; i++) {
                    const px = pos.getX(i);
                    const py = pos.getY(i);
                    const u = (maxX - px) / rangeX; // Un-mirror horizontally to match front view
                    const v = (py - minY) / rangeY;
                    uvs.setXY(i, Math.max(0, Math.min(1, u)), Math.max(0, Math.min(1, v)));
                  }
                  uvs.needsUpdate = true;
                }
              }

              const displayMat = new THREE.MeshBasicMaterial({
                map: clockCanvasTexture,
                color: 0xffffff,
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1,
                side: THREE.DoubleSide
              });
              if (isSingle) {
                screenMaterialSlots.push({ mesh: child, isSingle: true });
              } else {
                screenMaterialSlots.push({ mesh: child, index: idx, isSingle: false });
              }
              return displayMat;
            }

            // Dynamic Island
            if (matName.includes('dynamic') || matName.includes('iceland') || matName.includes('island')) {
              return new THREE.MeshBasicMaterial({
                color: 0x000000,
                polygonOffset: true,
                polygonOffsetFactor: -2,
                polygonOffsetUnits: -2,
                side: THREE.DoubleSide
              });
            }

            // Display Borders
            if (matName.includes('border')) {
              return new THREE.MeshBasicMaterial({
                color: 0x000000,
                side: THREE.DoubleSide
              });
            }

            // Glass Materials
            if (matName.includes('glass') || matName.includes('windshield')) {
              mat.transparent = true;
              mat.opacity = 0.35;
              mat.roughness = 0.05;
              mat.metalness = 0.9;
              mat.side = THREE.DoubleSide;
              return mat;
            }

            // Standard PBR Surfaces
            mat.side = THREE.DoubleSide;
            if (mat.roughness !== undefined) {
              mat.roughness = Math.max(mat.roughness, 0.22);
            }
            return mat;
          };

          if (Array.isArray(child.material)) {
            child.material = child.material.map((mat, idx) => configureMat(mat, idx, false));
          } else {
            child.material = configureMat(child.material, 0, true);
          }
        }
      });

      // 5. Activate default variant (White / Natural Titanium)
      setModelVariant('natural');

      scene.add(phoneGroup);
      applyClockTexture();
      console.log('✅ iPhone 17 Air GLB model loaded & initialized with live screen binding. Slots:', screenMaterialSlots.length);
    }

    function load3DModel() {
      // 1. Load iPhone 17 Air GLB model (public/models/iphone17air.glb)
      if (typeof THREE.GLTFLoader === 'function') {
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load(
          '/models/iphone17air.glb',
          (gltf) => {
            setupLoadedModel(gltf.scene, 'GLTFLoader (/models/iphone17air.glb)');
          },
          undefined,
          (err) => {
            console.warn('Failed to load /models/iphone17air.glb:', err);
            tryFallbackFBX();
          }
        );
        return;
      }
      tryFallbackFBX();

    function tryFallbackFBX() {
      if (typeof THREE.FBXLoader === 'function') {
        const fbxLoader = new THREE.FBXLoader();
        fbxLoader.load(
          '/models/iphone17pro.fbx',
          (fbx) => setupLoadedModel(fbx, 'FBXLoader (/models/iphone17pro.fbx)'),
          undefined,
          (err) => console.warn('Fallback FBX load failed:', err)
        );
      }
    }

    function setModelVariant(variantName) {
      if (!isExternalModelActive || !loadedModelObject) return;
      const target = (variantName || '').toLowerCase();

      loadedModelObject.traverse(child => {
        let variantGroup = null;
        let curr = child;
        while (curr && curr !== loadedModelObject) {
          const cName = (curr.name || '').toLowerCase();
          if (cName.includes('black')) {
            variantGroup = 'black';
            break;
          } else if (cName.includes('sky blue') || cName.includes('blue') || cName.includes('teal')) {
            variantGroup = 'teal';
            break;
          } else if (cName.includes('gold') || cName.includes('desert') || cName.includes('orange')) {
            variantGroup = 'desert';
            break;
          } else if (cName.includes('white') || cName.includes('silver') || cName.includes('natural') || cName.includes('grey')) {
            variantGroup = 'natural';
            break;
          }
          curr = curr.parent;
        }

        if (variantGroup) {
          if (target === 'natural' || target === 'white') {
            child.visible = (variantGroup === 'natural');
          } else if (target === 'black') {
            child.visible = (variantGroup === 'black');
          } else if (target === 'desert') {
            child.visible = (variantGroup === 'desert');
          } else if (target === 'teal' || target === 'blue') {
            child.visible = (variantGroup === 'teal');
          }
        }
      });

      if (currentScreenTexture) {
        updateAllScreenMeshes(currentScreenTexture);
      }
    }

    // Build the high-fidelity iPhone 17 Pro model matching user render
    function buildSmartphone() {
      phoneGroup = new THREE.Group();
      bodyMaterials = [];
      frameMaterials = [];
      backGlassMaterials = [];
      accentMaterials = [];

      const initialFinish = TITANIUM_FINISHES[currentFinish];

      const chamferMaterial = new THREE.MeshStandardMaterial({

      // Camera Sapphire Glass Element

        transparent: true,
        opacity: 0.92

      // Camera AR Multi-Coating Optical Reflection Accent
      const lensIrisMat = new THREE.MeshStandardMaterial({
        color: 0x064e52, // Emerald & indigo anti-reflective coating sheen
        roughness: 0.08,

      });

      // Camera Outer Titanium Ring
      const lensRingOuterMat = new THREE.MeshStandardMaterial({
        color: initialFinish.chamfer,
        metalness: 0.96,

      const lensRingInnerMat = new THREE.MeshStandardMaterial({
        color: 0x16171a,

      // LiDAR Sensor Material
      const lidarMat = new THREE.MeshStandardMaterial({

      // Flash Materials
      const flashLEDMat = new THREE.MeshBasicMaterial({ color: 0xfffae8 });
      const flashRingMat = new THREE.MeshStandardMaterial({ color: 0xd4d4d8, metalness: 0.85, roughness: 0.25 });

      // iPhone 17 Pro Dimensions
      const w = 3.35;   // Width
      const h = 7.0;    // Height
      const r = 0.52;   // Refined smooth curved corners
      const d = 0.22;   // Thin unibody chassis depth

      // 1. Titanium Chassis Body (Extruded Rounded Rectangle)
      const shape = new THREE.Shape();
      shape.moveTo(-w/2 + r, -h/2);
      shape.lineTo(w/2 - r, -h/2);
      shape.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
      shape.lineTo(w/2, h/2 - r);
      shape.quadraticCurveTo(w/2, h/2, w/2 - r, h/2);
      shape.lineTo(-w/2 + r, h/2);
      shape.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r);
      shape.lineTo(-w/2, -h/2 + r);
      shape.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);

      const chassisGeo = new THREE.ExtrudeGeometry(shape, {
        depth: d - 0.03,
        bevelEnabled: true,
        bevelSegments: 5,
        steps: 1,
        bevelSize: 0.015,
        bevelThickness: 0.015
      });
      chassisGeo.center();
      const chassisMesh = new THREE.Mesh(chassisGeo, bodyMaterial);
      chassisMesh.castShadow = true;

      // 2. Titanium Perimeter Frame Band

    // ----------------------------------------------------
    // Screen Custom Screen Textures (iOS 18/19 Next-Gen Canvas)
    // ----------------------------------------------------
    
    // 1. Fallback dynamic iOS Clock screen setup
    function setupClockCanvas() {
      canvasElement = document.createElement('canvas');
      canvasElement.width = 512;
      canvasElement.height = 1120;
      canvasCtx = canvasElement.getContext('2d');
      
      clockCanvasTexture = new THREE.CanvasTexture(canvasElement);
      clockCanvasTexture.minFilter = THREE.LinearFilter;
      clockCanvasTexture.magFilter = THREE.LinearFilter;
      clockCanvasTexture.wrapS = THREE.ClampToEdgeWrapping;
      clockCanvasTexture.wrapT = THREE.ClampToEdgeWrapping;
      if (screenMesh) {
        screenMesh.material.map = clockCanvasTexture;
        screenMesh.material.color.setHex(0xffffff);
        screenMesh.material.needsUpdate = true;
      }
      renderClockCanvas();
    }

    function renderClockCanvas() {
      if (currentScreenType !== 'clock' || !canvasCtx || !clockCanvasTexture) return;

      const w = canvasElement.width;
      const h = canvasElement.height;
      const timeNow = Date.now();

      // 1. iPhone 17 Pro Silver-Slate Fluid Aura Wallpaper (Matching Reference Image)
      const bgGrad = canvasCtx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, '#9bb1c8');     // Ice-blue slate top-left
      bgGrad.addColorStop(0.3, '#748ba3');
      bgGrad.addColorStop(0.65, '#3b4b5e');
      bgGrad.addColorStop(1, '#151d28');      // Deep slate-charcoal bottom-right
      canvasCtx.fillStyle = bgGrad;
      canvasCtx.fillRect(0, 0, w, h);

      // Fluid sculpted organic ribbon wave contour from reference image
      canvasCtx.save();
      // Flowing dark shadow ribbon
      canvasCtx.fillStyle = '#111822';
      canvasCtx.beginPath();
      canvasCtx.moveTo(w * 0.15, 0);
      canvasCtx.bezierCurveTo(w * 0.5, h * 0.25, w * 0.95, h * 0.45, w * 0.85, h * 0.65);
      canvasCtx.bezierCurveTo(w * 0.75, h * 0.82, w * 0.35, h * 0.92, w * 0.45, h);
      canvasCtx.lineTo(0, h);
      canvasCtx.lineTo(0, 0);
      canvasCtx.closePath();
      canvasCtx.fill();

      // Soft ambient light wave glow
      const fluidGrad = canvasCtx.createRadialGradient(w * 0.35, h * 0.72, 30, w * 0.35, h * 0.72, 280);
      fluidGrad.addColorStop(0, 'rgba(186, 215, 242, 0.9)');
      fluidGrad.addColorStop(0.5, 'rgba(147, 180, 211, 0.5)');
      fluidGrad.addColorStop(1, 'rgba(30, 41, 59, 0)');
      canvasCtx.fillStyle = fluidGrad;
      canvasCtx.beginPath();
      canvasCtx.arc(w * 0.35, h * 0.72, 280, 0, Math.PI * 2);
      canvasCtx.fill();

      // Sweeping luminous silver curve contour
      canvasCtx.lineWidth = 12;
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      canvasCtx.beginPath();
      canvasCtx.moveTo(w * 0.15, 0);
      canvasCtx.bezierCurveTo(w * 0.5, h * 0.25, w * 0.95, h * 0.45, w * 0.85, h * 0.65);
      canvasCtx.bezierCurveTo(w * 0.75, h * 0.82, w * 0.35, h * 0.92, w * 0.45, h);
      canvasCtx.stroke();
      canvasCtx.restore();

      // 2. iOS Status Bar
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const timeShort = `${hours}:${minutes}`;
      const timeFull = `${hours}:${minutes}:${seconds}`;
      const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

      // Left: Current Time
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = '600 20px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.textAlign = 'left';
      canvasCtx.fillText(timeShort, 42, 45);

      // Right: Signal, 5G, Wi-Fi & Battery Capsule
      // 4 Signal Bars
      canvasCtx.fillStyle = '#ffffff';
      for (let i = 0; i < 4; i++) {
        const barH = 5 + i * 3;
        canvasCtx.fillRect(w - 145 + i * 5, 45 - barH, 3, barH);
      }

      // 5G Icon
      canvasCtx.font = '700 13px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.fillText('5G', w - 120, 45);

      // Battery Capsule
      const batX = w - 80;
      const batY = 32;
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      canvasCtx.lineWidth = 1.5;
      canvasCtx.beginPath();
      canvasCtx.roundRect(batX, batY, 34, 16, 4);
      canvasCtx.stroke();
      // Battery nub
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      canvasCtx.fillRect(batX + 35, batY + 4, 2, 8);
      // Battery charge fill (88%)
      canvasCtx.fillStyle = '#22c55e'; // Vibrant Apple Green
      canvasCtx.beginPath();
      canvasCtx.roundRect(batX + 2, batY + 2, 26, 12, 2);
      canvasCtx.fill();
      // Battery text inside
      canvasCtx.fillStyle = '#000000';
      canvasCtx.font = 'bold 9px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.textAlign = 'center';
      canvasCtx.fillText('88', batX + 15, batY + 11);

      // 3. Dynamic Island Live Activity (Compact interactive status at top)
      const diW = 210;
      const diH = 40;
      const diX = (w - diW) / 2;
      const diY = 16;
      canvasCtx.fillStyle = '#000000';
      canvasCtx.beginPath();
      canvasCtx.roundRect(diX, diY, diW, diH, diH / 2);
      canvasCtx.fill();
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      canvasCtx.lineWidth = 1;
      canvasCtx.stroke();

      // Mini animated audio equalizer in Dynamic Island (left side)
      canvasCtx.fillStyle = '#38bdf8';
      for (let i = 0; i < 4; i++) {
        const hVal = 6 + Math.abs(Math.sin((timeNow / 200) + i * 1.2)) * 14;
        canvasCtx.beginPath();
        canvasCtx.roundRect(diX + 18 + i * 6, diY + diH/2 - hVal/2, 3, hVal, 1.5);
        canvasCtx.fill();
      }

      // Center title in Dynamic Island
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      canvasCtx.font = '600 12px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.textAlign = 'center';
      canvasCtx.fillText('Live Activity', diX + diW/2, diY + diH/2 + 4);

      // Mini album thumbnail on right side of Dynamic Island
      const miniAlbGrad = canvasCtx.createLinearGradient(diX + diW - 36, diY + 8, diX + diW - 12, diY + 32);
      miniAlbGrad.addColorStop(0, '#38bdf8');
      miniAlbGrad.addColorStop(1, '#6366f1');
      canvasCtx.fillStyle = miniAlbGrad;
      canvasCtx.beginPath();
      canvasCtx.roundRect(diX + diW - 36, diY + 8, 24, 24, 6);
      canvasCtx.fill();

      // 4. Next-Gen iOS 18/19 Depth Clock
      // Lock Screen Date
      canvasCtx.fillStyle = 'rgba(241, 245, 249, 0.9)';
      canvasCtx.font = '600 24px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.textAlign = 'center';
      canvasCtx.fillText(dateStr, w/2, 175);

      // Large iOS Clock Display
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = '700 88px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.shadowColor = 'rgba(15, 23, 42, 0.5)';
      canvasCtx.shadowBlur = 18;
      canvasCtx.fillText(timeShort, w/2, 270);
      canvasCtx.shadowBlur = 0; // Reset shadow

      // 5. Glassmorphic Apple Music Live Activity Widget Card
      const cardX = 32;
      const cardY = 560;
      const cardW = 448;
      const cardH = 175;
      const cardR = 24;

      // Card Frosted Glass Background
      canvasCtx.save();
      canvasCtx.fillStyle = 'rgba(15, 23, 42, 0.72)';
      canvasCtx.beginPath();
      canvasCtx.roundRect(cardX, cardY, cardW, cardH, cardR);
      canvasCtx.fill();
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      canvasCtx.lineWidth = 1.5;
      canvasCtx.stroke();

      // Album Art Cover
      const albX = cardX + 20;
      const albY = cardY + 20;
      const albSize = 75;
      const albGrad = canvasCtx.createLinearGradient(albX, albY, albX + albSize, albY + albSize);
      albGrad.addColorStop(0, '#38bdf8');
      albGrad.addColorStop(0.5, '#6366f1');
      albGrad.addColorStop(1, '#a855f7');
      canvasCtx.fillStyle = albGrad;
      canvasCtx.beginPath();
      canvasCtx.roundRect(albX, albY, albSize, albSize, 14);
      canvasCtx.fill();

      // Music Icon Inside Album Art
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = '32px Arial';
      canvasCtx.textAlign = 'center';
      canvasCtx.fillText('🎵', albX + albSize/2, albY + albSize/2 + 12);

      // Song Title & Artist
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.textAlign = 'left';
      canvasCtx.fillText('Aura Titanium', albX + albSize + 18, albY + 28);

      canvasCtx.fillStyle = 'rgba(203, 213, 225, 0.85)';
      canvasCtx.font = '500 14px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.fillText('iPhone 17 Pro • Spatial Audio', albX + albSize + 18, albY + 52);

      // Live Animated Equalizer Bars in Card
      const eqStartX = cardX + cardW - 70;
      for (let i = 0; i < 5; i++) {
        const barHeight = 8 + Math.abs(Math.sin((timeNow / 160) + i * 0.9)) * 24;
        canvasCtx.fillStyle = '#38bdf8';
        canvasCtx.beginPath();
        canvasCtx.roundRect(eqStartX + i * 8, albY + 45 - barHeight/2, 4, barHeight, 2);
        canvasCtx.fill();
      }

      // Track Progress Bar
      const progX = albX;
      const progY = cardY + 115;
      const progW = cardW - 40;
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      canvasCtx.beginPath();
      canvasCtx.roundRect(progX, progY, progW, 4, 2);
      canvasCtx.fill();

      // Progress Fill (42%)
      const filledW = progW * 0.42;
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.beginPath();
      canvasCtx.roundRect(progX, progY, filledW, 4, 2);
      canvasCtx.fill();
      // Progress Knob
      canvasCtx.beginPath();
      canvasCtx.arc(progX + filledW, progY + 2, 5, 0, Math.PI * 2);
      canvasCtx.fill();

      // Timestamps & Controls
      canvasCtx.fillStyle = 'rgba(148, 163, 184, 0.9)';
      canvasCtx.font = '500 12px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
      canvasCtx.fillText('1:42', progX, progY + 20);
      canvasCtx.textAlign = 'right';
      canvasCtx.fillText('-2:38', progX + progW, progY + 20);

      // Controls (Previous, Play, Next)
      canvasCtx.textAlign = 'center';
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.font = '22px Arial';
      canvasCtx.fillText('⏮', cardX + cardW/2 - 50, progY + 28);
      canvasCtx.font = '26px Arial';
      canvasCtx.fillText('⏸', cardX + cardW/2, progY + 28);
      canvasCtx.font = '22px Arial';
      canvasCtx.fillText('⏭', cardX + cardW/2 + 50, progY + 28);
      canvasCtx.restore();

      // 6. Quick Action Lockscreen Buttons (Flashlight & Camera)
      // Flashlight Button (Bottom Left)
      const flashBtnX = 64;
      const flashBtnY = h - 130;
      const btnRadius = 30;
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      canvasCtx.beginPath();
      canvasCtx.arc(flashBtnX, flashBtnY, btnRadius, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      canvasCtx.lineWidth = 1;
      canvasCtx.stroke();
      canvasCtx.font = '24px Arial';
      canvasCtx.textAlign = 'center';
      canvasCtx.fillText('🔦', flashBtnX, flashBtnY + 8);

      // Camera Button (Bottom Right)
      const camBtnX = w - 64;
      const camBtnY = h - 130;
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      canvasCtx.beginPath();
      canvasCtx.arc(camBtnX, camBtnY, btnRadius, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      canvasCtx.stroke();
      canvasCtx.font = '24px Arial';
      canvasCtx.fillText('📷', camBtnX, camBtnY + 8);

      // 7. Home Indicator Swipe Bar
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      canvasCtx.beginPath();
      canvasCtx.roundRect(w/2 - 75, h - 35, 150, 5, 2.5);
      canvasCtx.fill();

      // Trigger WebGL update
      clockCanvasTexture.needsUpdate = true;
    }

    function applyClockTexture() {
      currentScreenType = 'clock';
      cleanupVideo();
      // Re-bind the clock canvas texture across all variant screen meshes
      if (clockCanvasTexture) {
        updateAllScreenMeshes(clockCanvasTexture);
        renderClockCanvas();
      }
    }

    function applyMirrorTexture() {
      currentScreenType = 'mirror';
      cleanupVideo();
      // Re-bind the clock canvas texture which will display the mirrored frames
      if (clockCanvasTexture) {
        updateAllScreenMeshes(clockCanvasTexture);
      }
      
      if (canvasElement && canvasCtx) {
        const w = canvasElement.width;
        const h = canvasElement.height;
        canvasCtx.fillStyle = '#0b0f19';
        canvasCtx.fillRect(0, 0, w, h);
        
        canvasCtx.fillStyle = '#ffffff';
        canvasCtx.font = 'bold 20px Inter, sans-serif';
        canvasCtx.textAlign = 'center';
        canvasCtx.fillText('Waiting for screen share...', w/2, h/2);
      }
      if (clockCanvasTexture) {
        clockCanvasTexture.needsUpdate = true;
      }
    }

    async function applyWindowShareTexture() {
      currentScreenType = 'window';
      cleanupVideo();

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            displaySurface: "window"
          },
          audio: false
        });

        activeVideoElement = document.createElement('video');
        activeVideoElement.autoplay = true;
        activeVideoElement.playsInline = true;
        activeVideoElement.muted = true;

        activeVideoElement.onloadedmetadata = () => {
          activeVideoElement.play().catch(console.error);
          const winTex = new THREE.VideoTexture(activeVideoElement);
          winTex.minFilter = THREE.LinearFilter;
          winTex.magFilter = THREE.LinearFilter;
          updateAllScreenMeshes(winTex);
        };

        activeVideoElement.srcObject = stream;

        activeLocalStream = stream;

        // If user stops sharing from browser UI bar
        stream.getVideoTracks()[0].onended = () => {
          stopLocalWindowShare();
          applyClockTexture();
          screenSourceSelect.value = 'clock';
        };
      } catch (err) {
        console.error("Local window share failed:", err);
        screenSourceSelect.value = 'clock';
        applyClockTexture();
      }
    }

    function stopLocalWindowShare() {
      if (activeLocalStream) {
        activeLocalStream.getTracks().forEach(track => track.stop());
        activeLocalStream = null;
      }
      cleanupVideo();
    }

    // 2. Custom image screen source loading
    function applyImageTexture(fileOrUrl) {
      currentScreenType = 'image';
      cleanupVideo();

      if (typeof fileOrUrl === 'string') {
        const loader = new THREE.TextureLoader();
        loader.load(fileOrUrl, (tex) => {
          tex.generateMipmaps = true;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          updateAllScreenMeshes(tex);
        });
      } else if (fileOrUrl instanceof File || fileOrUrl instanceof Blob) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const loader = new THREE.TextureLoader();
          loader.load(e.target.result, (tex) => {
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            updateAllScreenMeshes(tex);
          });
        };
        reader.readAsDataURL(fileOrUrl);
      } else {
        // Default Demo Image Screen
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0,0,0,1024);
        grad.addColorStop(0, '#f43f5e');
        grad.addColorStop(1, '#8b5cf6');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,512,1024);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('App Mockup Staging', 256, 512);
        
        const demoImgTex = new THREE.CanvasTexture(canvas);
        updateAllScreenMeshes(demoImgTex);
      }
    }

    // 3. Custom video screen source loading
    function applyVideoTexture(fileOrUrl) {
      currentScreenType = 'video';
      cleanupVideo();

      if (fileOrUrl) {
        activeVideoElement = document.createElement('video');
        activeVideoElement.autoplay = true;
        activeVideoElement.loop = true;
        activeVideoElement.muted = true;
        activeVideoElement.playsInline = true;
        if (typeof fileOrUrl === 'string') {
          activeVideoElement.src = fileOrUrl;
        } else {
          activeVideoElement.src = URL.createObjectURL(fileOrUrl);
        }

        activeVideoElement.oncanplay = () => {
          activeVideoElement.play().catch(console.error);
          const videoTex = new THREE.VideoTexture(activeVideoElement);
          videoTex.minFilter = THREE.LinearFilter;
          videoTex.magFilter = THREE.LinearFilter;
          videoTex.format = THREE.RGBAFormat;
          updateAllScreenMeshes(videoTex);
        };
      } else {
        // Fallback default demo color noise
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        let currentHue = 0;
        
        const demoVideoTex = new THREE.CanvasTexture(canvas);
        updateAllScreenMeshes(demoVideoTex);
        
        const renderNoise = () => {
          if (currentScreenType !== 'video') return;
          currentHue = (currentHue + 1) % 360;
          ctx.fillStyle = `hsl(${currentHue}, 80%, 40%)`;
          ctx.fillRect(0, 0, 128, 256);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Interactive Video Loop', 64, 128);
          demoVideoTex.needsUpdate = true;
          demoVideoLoopId = requestAnimationFrame(renderNoise);
        };
        
        renderNoise();
      }
    }

    function cleanupVideo() {
      if (demoVideoLoopId) {
        cancelAnimationFrame(demoVideoLoopId);
        demoVideoLoopId = null;
      }
      if (activeVideoElement) {
        activeVideoElement.pause();
        activeVideoElement.src = "";
        activeVideoElement.srcObject = null;
        activeVideoElement.load();
        activeVideoElement = null;
      }
    }

    // ----------------------------------------------------
    // Environment & Styling Themes Updates
    // ----------------------------------------------------
    function updateStagingEnvironment(preset) {
      if (preset) currentStagingPreset = preset;
      else if (bgPresetSelect) currentStagingPreset = bgPresetSelect.value;
      const effectivePreset = currentStagingPreset;
      
      switch (effectivePreset) {
        case 'cyberpunk':
          scene.background.setHex(0x05010a);
          scene.fog.color.setHex(0x05010a);
          renderer.setClearColor(0x05010a);
          break;
        case 'minimal-light':
          scene.background.setHex(0xf1f5f9);
          scene.fog.color.setHex(0xf1f5f9);
          renderer.setClearColor(0xf1f5f9);
          break;
        case 'pure-black':
          scene.background.setHex(0x000000);
          scene.fog.color.setHex(0x000000);
          renderer.setClearColor(0x000000);
          break;
        case 'dark-slate':
        default:
          scene.background.setHex(0x0c0d10);
          scene.fog.color.setHex(0x0c0d10);
          renderer.setClearColor(0x0c0d10);
          break;
      }
    }

    // Quick camera reset position
    cameraResetBtn.addEventListener('click', () => {
      controls.reset();
      camera.position.set(0, 0, 11);
      controls.target.set(0, 0, 0);
      controls.update();
      console.log('Camera view reset.');
    });

    // ----------------------------------------------------
    // Rendering & Smooth Slerp Damping Loops
    // ----------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      // 1. Process fallback clock screen texture updates
      if (currentScreenType === 'clock') {
        renderClockCanvas();
      }

      // 2. Smoothly rotate the phone group based on current target rotation
      // Standard THREE.Quaternion slerp provides spherical interpolation for rotations
      if (phoneGroup) {
        phoneGroup.quaternion.slerp(targetRotation, config.damping);
      }

      // 3. Update Camera Orbit Controls
      controls.update();

      // 4. Render Scene
      renderer.render(scene, camera);
    }

    // Handle resizing windows gracefully
    window.addEventListener('resize', onWindowResize, false);
    
    function onWindowResize() {
      if (!container || !camera || !renderer) return;
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;
      if (!width || !height) return;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    // ----------------------------------------------------
    // App Initialization Hook
    // ----------------------------------------------------
    function startApp() {
      init3D();
      initPeerConnection();
      setTimeout(onWindowResize, 100);
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
